server {
  listen 8080;
  server_name _;

  # Keep redirects relative. The HUB may be exposed through a different
  # external port or TLS reverse proxy than nginx listens on internally.
  absolute_redirect off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' http://localhost:9000 https:; form-action 'self'" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location /api/ {
    proxy_pass http://integration-core:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $http_x_request_id;

    # REM-5B: explicit upstream timeouts, rather than nginx's 60s defaults.
    # Chosen relative to the HUB frontend's own client-side deadline
    # (src/api/client.ts's DEFAULT_REQUEST_TIMEOUT_MS, 20s): read/send are
    # set to 25s, five seconds past the client's own timeout, so the client
    # is the one that decides the user sees a "timed out" message first —
    # nginx's 504 is a backstop for a request the client itself already gave
    # up on, not the primary signal. connect_timeout is set much lower (5s)
    # since a TCP connect either succeeds quickly or the upstream is down;
    # there is no reason to wait as long for that as for a slow response.
    proxy_connect_timeout 5s;
    proxy_send_timeout 25s;
    proxy_read_timeout 25s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
