name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # A cross-repository gate: the HUB consumes the Integration Core's normalized
  # API, the two are versioned independently, and nothing connected them. The
  # HUB's own tests answer every request from a fake, so a path renamed in the
  # platform leaves this repository green and the failure waits for a browser.
  contract:
    name: Normalized API contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: bsystem-hub

      # The matching branch where one exists, so a paired change is validated
      # against its pair rather than against main. A missing match falls back
      # to main and says so in the run summary, because most HUB changes have
      # no paired platform branch and failing them all would make the gate an
      # obstacle rather than a check.
      - name: Resolve the Integration Core branch
        id: core-ref
        run: |
          ref="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/ekucher/bsystem-integration-core "$ref" >/dev/null 2>&1; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "Validating against the matching Integration Core branch \`$ref\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "No matching Integration Core branch; validating against \`main\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout Integration Core
        uses: actions/checkout@v7
        with:
          repository: ekucher/bsystem-integration-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: bsystem-integration-core

      # Which pair was actually validated. Without this the run says the
      # contract holds without saying what it holds against, and a green badge
      # on a stale provider is the thing this gate exists to prevent.
      - name: Record the pair
        working-directory: bsystem-integration-core
        run: |
          echo "Integration Core commit: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # Python rather than a Node dependency: this is a CI check, and adding a
      # YAML parser to the application's dependency tree to run it would put a
      # package in the shipped manifest for the sake of a workflow.
      - name: Check every requested path exists
        working-directory: bsystem-hub
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check-api-contract.py

      # The gate itself, against fixtures. It has only ever been run against a
      # specification and a source tree that agree, so it has never been shown
      # to catch a change that breaks them — and a gate that silently stopped
      # failing is worse than none, because the badge says otherwise.
      - name: Check the gate catches a breaking provider change
        working-directory: bsystem-hub
        run: bash scripts/tests/contract-gate.test.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Run on every build rather than only in the security workflow, so a
      # vulnerable dependency cannot be merged while waiting for a scheduled
      # scan.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      # Unit, integration and automated accessibility checks. The
      # accessibility assertions run axe over every rendered page.
      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_OIDC_AUTHORITY: http://localhost:9000/application/o/bsystem-hub/
          VITE_OIDC_CLIENT_ID: ci-public-client
        run: npm run build
