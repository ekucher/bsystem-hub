name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Unit, integration and automated accessibility checks. The
      # accessibility assertions run axe over every rendered page.
      - name: Test
        run: npm test

      - name: Build
        env:
          VITE_OIDC_AUTHORITY: http://localhost:9000/application/o/bsystem-hub/
          VITE_OIDC_CLIENT_ID: ci-public-client
        run: npm run build
