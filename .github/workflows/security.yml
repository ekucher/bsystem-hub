name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A vulnerability database changes without the code changing, so a
    # scheduled run is what catches a dependency that became vulnerable
    # overnight. A pull-request-only scan reports the state of the world when
    # the branch was last touched.
    - cron: "31 4 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Production dependencies ship to a browser, so anything reachable there
      # fails the build outright.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      # Development dependencies do not ship, but they do run on developer
      # machines and on CI runners holding tokens, so a high finding is still
      # a failure.
      - name: Audit all dependencies
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Gitleaks scans history, not just the working tree: a secret that
          # was committed and then removed is still a leaked secret.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem:
    name: Dependency and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # An SBOM is what makes the next advisory answerable without a re-scan:
      # were we shipping this package, and in which build?
      - name: Generate an SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          format: cyclonedx
          output: sbom.cyclonedx.json

      - name: Publish the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-hub
          path: sbom.cyclonedx.json
          retention-days: 90

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Analyse
        uses: github/codeql-action/analyze@v3
